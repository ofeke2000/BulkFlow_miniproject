
mask_type: cf4             # "cf4" or "uniform"

MDPL2:
  HubbleParameter: 0.6777                 # Hubble parameter for distance conversions
  box_size: 1000.0                        # h^-1 Mpc

paths:
  rockstar_catalog: "~/bulk-flow-Rockstar/Data/mdpl2_rockstar_125_pid-1_mvir12/mdpl2_rockstar_125_pid-1_mvir12.csv"
  cf4_catalog: "~/bulk-flow-Rockstar/Data/cf4_group_catalogue/cf4_group_catalogue.csv"
  output_dir: "~/BulkFlow_miniproject/BulkFlow_miniproject/output/Quick_test_bulkflow_results.h5"

columns:
  - rockstarid
  - mvir
  - x
  - y
  - z
  - vx
  - vy
  - vz

overdensity:
  radius: 5.0    # h^-1 Mpc
  n_lowest_delta: 1

bulkflow:
  max_radius: 250.0          # h^-1 Mpc
  min_radius: 5.0            # h^-1 Mpc
  radii_step: 5              # h^-1 Mpc
  error_fraction: 0.2        # 20%
  sigma_star: 250.0          # km/s
  sigma_min: 50.0            # km/s


visualization:
  projection_plane: "xy"
