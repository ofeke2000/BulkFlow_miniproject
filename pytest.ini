[pytest]
# Add the repo root to sys.path so `from src.module import ...` resolves
# exactly as it does for main.py (which runs from this directory).
pythonpath = .
testpaths = tests
# Small synthetic catalogs make A singular at the smallest radii (fewer than 3
# non-collinear halos). That is expected and exercised on purpose, so silence the
# resulting LinAlgWarning rather than letting it clutter the report.
filterwarnings =
    ignore:.*Singular matrix.*:scipy.linalg.LinAlgWarning
